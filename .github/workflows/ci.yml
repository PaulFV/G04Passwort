name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: bash tool/ci_annotate.sh "pub get" flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Code is not formatted (run dart format)."

      - name: Analyze
        run: bash tool/ci_annotate.sh "flutter analyze" flutter analyze --no-fatal-infos

      - name: Test
        if: always()
        run: bash tool/ci_annotate.sh "flutter test" flutter test --reporter expanded

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch drift web assets (sqlite3.wasm, drift_worker.js)
        run: bash tool/setup_web.sh
      - run: bash tool/ci_annotate.sh "build web" flutter build web --release --no-web-resources-cdn
      - name: Publish web preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd build/web
          git init -q -b web-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "web preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" web-preview
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: g04passwort-web
          retention-days: 3
          path: build/web

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash tool/ci_annotate.sh "build apk" flutter build apk --debug
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: g04passwort-debug-apk
          retention-days: 3
          path: build/app/outputs/flutter-apk/app-debug.apk

  # Keeps the code base consistently formatted (dart format) on main.
  auto-format:
    name: Auto-format
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: dart format [skip ci]"
            git push
          fi
