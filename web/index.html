       align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0b1f4d,#050A1A 70%);
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#9FB3D9;z-index:9999;">

  <script>
    (function () {
      var loader = document.getElementById('g04-loader');
      var status = document.getElementById('g04-status');
      var box = document.getElementById('g04-error');
      function showError(msg) {
        if (!loader || !loader.parentNode) return;
        status.textContent = 'Die App konnte nicht gestartet werden.';
        box.style.display = 'block';
        box.textContent = String(msg || 'Unbekannter Fehler');
      }
      window.addEventListener('error', function (e) { showError(e.message || e.error); });
      window.addEventListener('unhandledrejection', function (e) { showError(e.reason); });
      window.addEventListener('flutter-first-frame', function () {
        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      });
      setTimeout(function () {
        if (loader && loader.parentNode && box.style.display === 'none') {
          status.textContent = 'Das dauert ungewöhnlich lange … bitte Seite neu laden.';

    })();
