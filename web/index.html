<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="G04Passwort – Premium Passwort-Tresor.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="G04Passwort">
  <meta name="theme-color" content="#050A1A">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>G04Passwort</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#050A1A;">
  <!-- Loading screen shown until Flutter renders its first frame. -->
  <div id="g04-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;
       align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0b1f4d,#050A1A 70%);
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#9FB3D9;z-index:9999;">
    <img src="icons/logo-loading.png" alt="G04Passwort" style="width:200px;max-width:60vw;">
    <div id="g04-status" style="margin-top:28px;font-size:14px;">Wird geladen …</div>
    <div id="g04-error" style="display:none;margin:18px 24px 0;padding:12px 14px;border:1px solid #ff4d6a;
         border-radius:12px;color:#ffb3c0;font-size:12px;max-width:520px;word-break:break-word;"></div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('g04-loader');
      var status = document.getElementById('g04-status');
      var box = document.getElementById('g04-error');
      function showError(msg) {
        if (!loader || !loader.parentNode) return;
        status.textContent = 'Die App konnte nicht gestartet werden.';
        box.style.display = 'block';
        box.textContent = String(msg || 'Unbekannter Fehler');
      }
      window.addEventListener('error', function (e) { showError(e.message || e.error); });
      window.addEventListener('unhandledrejection', function (e) { showError(e.reason); });
      window.addEventListener('flutter-first-frame', function () {
        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      });
      setTimeout(function () {
        if (loader && loader.parentNode && box.style.display === 'none') {
          status.textContent = 'Das dauert ungewöhnlich lange … bitte Seite neu laden.';
        }
      }, 25000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
