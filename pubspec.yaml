name: g04passwort
description: "G04Passwort – Premium Passwort-Tresor."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^3.4.0
  # Navigation
  go_router: ^18.0.0
  # Persistence (SQLite on native, WASM/IndexedDB on web)
  drift: ^2.30.0
  drift_flutter: ^0.3.0
  web: ^1.1.0
  # sqlite3 3.9.0 ships a sqlite3.wasm that fails to load in the web app
  # (LinkError "dart.dispatch_trace") – stay on the last working line.
  sqlite3: ">=3.8.0 <3.9.0"
  # Keychain / Keystore backed storage for keys and settings
  flutter_secure_storage: ^11.0.0
  # Fingerprint / Face ID / Windows Hello
  local_auth: ^3.0.0
  # AES-256-GCM, Argon2id, PBKDF2, HMAC (TOTP)
  cryptography: ^2.8.0
  # Formatting & localisation
  intl: ^0.20.2
  # Animations
  lottie: ^3.6.0
  # Utilities
  uuid: ^4.5.0
  file_picker: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/
    - assets/lottie/
    - assets/branding/
    - assets/icons/
    - assets/fonts/OFL.txt

  # Bundled locally so the web app never loads fonts from Google servers
  # (no IP transfer to third parties – GDPR).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
